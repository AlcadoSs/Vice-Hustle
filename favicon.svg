<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="sun" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FF2E88"/>
      <stop offset=".55" stop-color="#FF6A3D"/>
      <stop offset="1" stop-color="#FFC94A"/>
    </linearGradient>
    <mask id="bands">
      <circle cx="30" cy="35" r="16.5" fill="#fff"/>
      <rect x="10" y="36.5" width="40" height="2.2" fill="#000"/>
      <rect x="10" y="41"   width="40" height="3.2" fill="#000"/>
      <rect x="10" y="46"   width="40" height="4.2" fill="#000"/>
    </mask>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.1" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- banded synthwave sun -->
  <circle cx="30" cy="35" r="16.5" fill="url(#sun)" mask="url(#bands)"/>

  <!-- palm silhouette, neon pink with soft glow -->
  <g fill="#FF2E88" filter="url(#glow)">
    <path d="M37.2 31.5 Q35 20 29 15.5 Q35.5 22 39.5 30.5 Z"/>
    <path d="M37 31.8 Q27 22 18.5 23.5 Q28 27 37.2 34.5 Z"/>
    <path d="M37.2 32.5 Q26 30 20 34.5 Q29.5 33.5 38 35.5 Z"/>
    <path d="M38.6 31.5 Q46.5 20.5 55 22 Q46.5 26.5 40 33.2 Z"/>
    <path d="M38.8 32.5 Q49.5 30 55.5 34.5 Q46.5 33.5 39.8 35.5 Z"/>
    <path d="M36.2 57.5 C37 48 34.5 39 38 31 L40.8 32.5 C38 39.5 39.5 48 39 57.5 Z"/>
  </g>
  <!-- coconuts -->
  <circle cx="36.6" cy="33.6" r="1.5" fill="#16E0BD"/>
  <circle cx="40.2" cy="33.2" r="1.5" fill="#16E0BD"/>

  <!-- teal water dashes -->
  <rect x="17" y="55.5" width="12" height="2.6" rx="1.3" fill="#16E0BD"/>
  <rect x="33" y="55.5" width="14" height="2.6" rx="1.3" fill="#16E0BD" opacity=".75"/>
</svg>
